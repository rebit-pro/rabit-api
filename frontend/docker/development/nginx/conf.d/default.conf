# Private link credentials must not enter nginx access logs.
map $request_uri $gallery_access_log {
    default 1;
    ~^/(api/v1/public/galleries|g|orders/access)/ 0;
    # J1: FIL-04 links carry a signed download token in the query string.
    ~^/api/v1/public/orders/current/downloads/ 0;
}

resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    access_log /var/log/nginx/access.log combined if=$gallery_access_log;
    add_header Referrer-Policy no-referrer always;
    listen 80;
    server_name _;
    charset utf-8;
    server_tokens off;

    location = /health {
        default_type text/plain;
        return 200 'alive';
    }

    location = /api {
        return 308 /api/;
    }

    # Requests use the canonical /api/v1/... path, preserved upstream.
    location ^~ /api/ {
        set $api_upstream ${API_UPSTREAM};
        proxy_pass $api_upstream;
        proxy_set_header Host ${API_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name ${API_HOST};
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location / {
        set $vite_upstream frontend-node:5173;
        proxy_pass http://$vite_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
