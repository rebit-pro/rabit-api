# Private link credentials must not enter nginx access logs.
map $request_uri $gallery_access_log {
    default 1;
    ~^/(api/v1/public/galleries|g|orders/access)/ 0;
}

resolver 127.0.0.11 valid=10s ipv6=off;

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

server {
    access_log /var/log/nginx/access.log combined if=$gallery_access_log;
    add_header Referrer-Policy no-referrer always;
    listen 80;
    server_name _;
    charset utf-8;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 30m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;

    location = /health {
        default_type text/plain;
        return 200 'alive';
    }

    location = /api {
        return 308 /api/;
    }

    # Preserve the canonical /api/v1/... path upstream.
    location ^~ /api/ {
        set $api_upstream ${API_UPSTREAM};
        proxy_pass $api_upstream;
        proxy_set_header Host ${API_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_ssl_server_name on;
        proxy_ssl_name ${API_HOST};
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Legacy direct derivative URLs are rejected by the API upstream.
    location ^~ /upload/morefoto/previews/ {
        limit_except GET HEAD {
            deny all;
        }

        set $api_upstream ${API_UPSTREAM};
        proxy_pass $api_upstream;
        proxy_set_header Host ${API_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_ssl_server_name on;
        proxy_ssl_name ${API_HOST};
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /index.html {
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
