; The extension itself is loaded once by docker-php-ext-xdebug.ini (docker-php-ext-enable in the Dockerfiles).
; XDEBUG_MODE overrides the mode: E2E and stage set XDEBUG_MODE=off. A log file only on demand: XDEBUG_CONFIG="log=/app/logs/xdebug.log".
xdebug.mode=develop,debug
xdebug.start_with_request=yes
xdebug.discover_client_host=0
xdebug.client_host=host.docker.internal
xdebug.client_port=9000
xdebug.idekey=PHPSTORM
