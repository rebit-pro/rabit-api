; The extension itself is loaded once by docker-php-ext-xdebug.ini (docker-php-ext-enable in the Dockerfiles).
; Off by default (#61, decision 2026-09-25): develop mode slows every request and debug tries the IDE on each one.
; Debugging is switched on by the XDEBUG_MODE variable, e.g. XDEBUG_MODE=debug,develop in .env and a container restart.
; A log file only on demand: XDEBUG_CONFIG="log=/app/logs/xdebug.log".
xdebug.mode=off
xdebug.start_with_request=yes
xdebug.discover_client_host=0
xdebug.client_host=host.docker.internal
xdebug.client_port=9000
xdebug.idekey=PHPSTORM
