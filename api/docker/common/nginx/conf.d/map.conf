map $http_origin $cors_origin {
    default "";
    "https://app.rebit-pro.ru"  "https://app.rebit-pro.ru";
    "https://rebit-pro.ru"      "https://rebit-pro.ru";
    "https://www.rebit-pro.ru"  "https://www.rebit-pro.ru";
    "https://rebit-p2p.loc"     "https://rebit-p2p.loc";
}

# Basic auth: off для CORS-запросов от фронтенда, "Restricted" для прямого доступа
map $http_origin $auth_type {
    default                     "Restricted";
    "https://app.rebit-pro.ru"  "off";
    "https://rebit-pro.ru"      "off";
    "https://www.rebit-pro.ru"  "off";
    "https://rebit-p2p.loc"     "off";
}
